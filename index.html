<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101b19">
  <title>Kraxes Coach</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="coach-extensions.css">
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <div class="brand"><span class="mark">K</span><div><strong>KRAXES</strong><small>COACH · MVP</small></div></div>
      <p class="side-label">ESPACIO DE TRABAJO</p>
      <nav aria-label="Secciones">
        <button data-view="dashboard" class="active">◫ <span>Resumen</span></button>
        <button data-view="students">◉ <span>Alumnos</span></button>
        <button data-view="plans">▤ <span>Rutinas</span></button>
        <button data-view="progress">⌁ <span>Progreso</span></button>
      </nav>
      <div class="sidebar-bottom"><span class="online"></span> Guardado en este navegador<br><small>Exportá un respaldo periódicamente.</small></div>
    </aside>
    <main>
      <header class="topbar"><div><p class="eyebrow">PANEL DEL ENTRENADOR</p><h1 id="page-title">Resumen</h1></div><div class="top-actions"><button class="secondary" id="export-btn">Exportar datos</button><label class="secondary file-button">Importar datos<input type="file" id="import-file" accept="application/json" hidden></label><button class="primary" id="new-student">+ Nuevo alumno</button></div></header>
      <div id="notice" role="status" aria-live="polite"></div>
      <section id="content"></section>
    </main>
  </div>
  <dialog id="modal"><form id="modal-form" method="dialog"><div id="modal-body"></div><div class="modal-actions"><button type="button" class="secondary" id="cancel-modal">Cancelar</button><button type="submit" class="primary">Guardar</button></div></form></dialog>
  <script src="app.js" defer></script>
  <script src="coach-extensions.js" defer></script>
</body>
</html>
